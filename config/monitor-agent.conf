[agent]
interval_seconds = 30
startup_jitter_seconds = 5
heartbeat_every_cycles = 10
log_path = /var/log/monitor-agent/agent.jsonl
hostname =
disk_path = /

[thresholds]
cpu_pct = 90
mem_pct = 90
zombie_count = 1
load1 = 8
disk_pct = 90

[network]
dns_timeout_seconds = 2
tcp_timeout_seconds = 3

[internal]
# 題目（PDF）明文給定：內網網段 192.168.1.0/24、中央伺服器 IP 192.168.1.254、FQDN www.graid.com。
# 題目**未指定 TCP 埠**；443 是本交付選擇的預設值，部署前須向現場確認中央主機實際提供的服務埠。
dest = 192.168.1.254
fqdn = www.graid.com
port = 443

[external]
# 題目只說明「可存取外部網路」，未給定外部目標；以下兩筆是本交付選擇的預設值，可依現場調整。
dest = 1.1.1.1
fqdn = example.com
port = 443
